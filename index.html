<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranker de Música Universal</title>
  
  <!-- Tipografías estéticas de Google Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Nunito:wght@400;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Librería externa para convertir el diseño en imagen descargable -->
  <script src="https://cloudflare.com"></script>

  <style>
    /* Variables de estilo inspiradas en Kink Jars */
    :root {
      --c: #e63946;          /* Color de acento (Rojo) */
      --on-c: #fff;          /* Texto sobre color de acento */
      --ink: #1d1a17;        /* Color del texto principal */
      --bg: #fbf6ef;         /* Fondo de la página (Crema claro) */
      --card: #fff;          /* Fondo de los bloques */
      --muted: #6b625a;      /* Texto secundario/atenuado */
      --line: #e9e0d5;       /* Bordes y líneas */
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.45;
      padding: 28px 16px;
    }

    .wrap { max-width: 650px; margin: 0 auto; }
    
    header { margin-bottom: 24px; text-align: center; }
    header h1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: clamp(36px, 7vw, 54px);
      margin: 0;
      line-height: 1.1;
      text-transform: uppercase;
    }
    header h1 span { color: var(--c); }
    header p { margin: 8px 0 0; color: var(--muted); font-size: 16px; }

    .panel {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .step {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h2 {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 24px;
      margin: 2px 0 14px;
      line-height: 1.2;
    }

    /* Buscadores */
    .buscador-group { display: flex; flex-direction: column; gap: 12px; }
    input[type=text], select {
      font: inherit;
      font-size: 18px;
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
    }
    input[type=text]:focus, select:focus { border-color: var(--ink); outline: none; }

    /* Bloque visual que se convertirá en foto */
    #zona-captura {
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 22px;
      padding: 30px;
      margin-top: 24px;
      position: relative;
    }
    .header-poster { text-align: center; margin-bottom: 24px; border-bottom: 2px dashed var(--line); padding-bottom: 16px; }
    .header-poster h3 { font-family: 'Oswald', sans-serif; font-size: 28px; margin: 0; text-transform: uppercase; }
    .header-poster p { margin: 4px 0 0; color: var(--muted); font-weight: 700; }

    /* Lista de canciones */
    .cancion-item {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 14px;
      align-items: center;
      padding: 12px 0;
      border-top: 2px dashed var(--line);
    }
    .cancion-item:first-of-type { border-top: 0; }
    .cancion-nombre { font-size: 17px; font-weight: 700; color: var(--ink); }
    
    /* Inputs de nota del 1 al 10 */
    .nota-input {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      font-weight: 600;
      height: 44px;
      text-align: center;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: #fff;
    }

    /* Marca de agua viral obligatoria */
    .watermark {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 24px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* Botón de descarga interactivo */
    .big-button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border-radius: 18px;
      border: 3px solid var(--ink);
      background: var(--c);
      color: var(--on-c);
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: .05em;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .big-button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
    .big-button:disabled { background: #ccc; box-shadow: none; border-color: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Rank <span>Music</span></h1>
    <p>Busca un artista, elige su álbum, puntúa cada canción del 1 al 10 y descarga tu tarjeta personalizada para compartir en redes.</p>
  </header>

  <main>
    <!-- Buscador e Interacción -->
    <section class="panel">
      <div class="step">Configuración</div>
      <h2>Encuentra tu álbum</h2>
      <div class="buscador-group">
        <input type="text" id="artista" placeholder="Escribe un artista (Ej: Rosalía, Daft Punk...)" list="lista-artistas" autocomplete="off">
        <datalist id="lista-artistas"></datalist>

        <select id="albumes" disabled>
          <option value="">-- Elige un artista primero --</option>
        </select>
      </div>
    </section>

    <!-- Zona visual (El Poster resultante) -->
    <div id="zona-captura">
      <div class="header-poster">
        <h3 id="view-album">Tu Álbum</h3>
        <p id="view-artista">Artista</p>
      </div>
      
      <div id="lista-canciones">
        <p style="text-align:center; color:var(--muted); font-size:16px;">Selecciona música para generar el listado.</p>
      </div>

      <!-- Marca de agua automática para cuando compartan la foto en Twitter -->
      <div class="watermark" id="marca-agua">HECHO EN: TU-USUARIO.GITHUB.IO</div>
    </div>

    <button class="big-button" id="btn-descargar" disabled>Guardar Imagen</button>
  </main>
</div>

<!-- Conexión con la lógica -->
<script src="app.js"></script>
</body>
</html>
